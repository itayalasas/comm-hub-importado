# Cabeceras de seguridad para todas las respuestas del panel.
# nginx no hereda add_header del server si la location define los suyos, así
# que este archivo se incluye en el server y en cada location con add_header.
#
# La CSP va en modo report-only: el navegador muestra en la consola lo que
# bloquearía, sin bloquearlo. Tras una semana sin avisos en el panel, cambiar
# el nombre de la cabecera a Content-Security-Policy para que bloquee.
# script-src 'self' frena scripts inline e inyectados: es la defensa
# principal si alguien logra meter HTML en una página. connect-src y frame-src
# aceptan cualquier https porque las URLs de auth y de las APIs llegan en
# tiempo de ejecución desde /get-env.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src 'self' https: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
