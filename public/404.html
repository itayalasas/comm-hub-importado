<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#061827" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Página no encontrada | SendCraft</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #e2e8f0;
        background:
          radial-gradient(circle at 25% 20%, rgba(6, 182, 212, 0.16), transparent 32rem),
          radial-gradient(circle at 80% 75%, rgba(14, 165, 233, 0.13), transparent 28rem),
          #050d1a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: 56px 32px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        background: rgba(10, 22, 40, 0.82);
        box-shadow: 0 32px 90px rgba(2, 12, 27, 0.5);
      }

      img {
        height: 34px;
        margin-bottom: 32px;
      }

      .code {
        margin: 0;
        color: #22d3ee;
        font-size: clamp(64px, 18vw, 112px);
        font-weight: 800;
        line-height: 1;
      }

      h1 {
        margin: 18px 0 12px;
        color: #fff;
        font-size: clamp(28px, 6vw, 42px);
      }

      p {
        margin: 0 auto 30px;
        max-width: 520px;
        color: #94a3b8;
        font-size: 17px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        border-radius: 12px;
        background: linear-gradient(90deg, #06b6d4, #0891b2);
        box-shadow: 0 14px 34px rgba(6, 182, 212, 0.22);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="SendCraft" />
      <p class="code">404</p>
      <h1>Esta página no existe</h1>
      <p>La dirección puede haber cambiado o el enlace ya no está disponible. Puedes continuar desde la página principal.</p>
      <a href="/">Volver a SendCraft</a>
    </main>
  </body>
</html>
