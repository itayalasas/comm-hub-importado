gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml
  text/css
  text/plain
  text/xml;

server {
  listen 80;
  server_name www.sendcraft.net;

  return 301 https://sendcraft.net$request_uri;
}

server {
  listen 80 default_server;
  server_name sendcraft.net _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/frame-protection.conf;

  error_page 404 /404.html;

  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location = /index.html {
    return 301 https://sendcraft.net/;
  }

  # Consolidate the retired SEO landing pages into the homepage.
  location ~ ^/(?:email-marketing|email-transaccional|api-email|smtp|alternativa-mailchimp|alternativa-sendgrid|precios)/?$ {
    return 301 https://sendcraft.net/;
  }

  # The OAuth callback must keep using its dedicated static document.
  location = /callback {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /callback.html =404;
  }

  location = /callback.html {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  # Utility and authenticated SPA routes stay accessible but never enter search indexes.
  # /embed/* está pensado para mostrarse dentro de sitios de clientes, así que
  # no lleva la protección contra iframes.
  location ~ ^/embed(?:/.*)?$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location ~ ^/(?:login|terms|privacy|docs|app|auth-processing|subscription|wallet|dashboard|admin-dashboard|templates|statistics|automatizaciones|documentation|settings|api-explorer|marketplace|whatsapp)(?:/.*)?$ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location = /robots.txt {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Vite fingerprints assets under /assets, so they can be cached permanently.
  location ~* ^/assets/.*\.(?:js|mjs|css|svg|png|jpg|jpeg|gif|webp|ico|woff2?|map)$ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Public images keep shorter caching because their filenames are not fingerprinted.
  location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location = /404.html {
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/frame-protection.conf;
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
  }

  # Serve real static files and return a genuine 404 for unknown routes.
  location / {
    try_files $uri =404;
  }
}
